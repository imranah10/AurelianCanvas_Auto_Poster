name: Aurelian Auto-Poster

on:
  schedule:
    # LAG-PROOF SCHEDULE: GitHub crons can fire hours late or get silently
    # dropped, so instead of trusting two exact slots we poll every 20 minutes.
    # The step below decides what to run based on the current UTC time:
    #   04:00-14:29 UTC (9:30 AM-7:59 PM IST) -> Pinterest pins
    #   14:30-23:59 UTC (8:00 PM-5:29 AM IST) -> Pinterest + Instagram
    # The poster is idempotent (state/posted.json) so extra runs never double-post.
    - cron: "*/20 * * * *"
  workflow_dispatch:            # manual "Run workflow" button
    inputs:
      dry_run:
        description: "Dry run (no real posting)"
        type: boolean
        default: false
      platform:
        description: "Which platform"
        type: choice
        default: all
        options: [all, pinterest, ig]

permissions:
  contents: write               # commit state/posted.json + media-ig crops
  issues: write                 # create automation-failure issues + label

concurrency:
  group: aurelian-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pillow pynacl requests

      - name: Run poster (scheduled - windowed)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          AURELIAN_BRANCH: main
        run: |
          HM=$((10#$(date -u +%H)$(date -u +%M)))
          if [ "$HM" -lt 400 ]; then
            echo "Before 9:30 AM IST window - nothing scheduled, skipping."
            exit 0
          fi
          if [ -z "$PINTEREST_REFRESH_TOKEN" ] && [ -z "$PINTEREST_ACCESS_TOKEN" ] && [ "$HM" -lt 1430 ]; then
            echo "Pinterest secrets not set yet and day window only posts pins - skipping."
            exit 0
          fi
          git pull --rebase --autostash origin main || true
          if [ "$HM" -ge 1430 ]; then
            echo "Evening window (8:00 PM+ IST): Pinterest + Instagram"
            python3 scripts/poster.py
          else
            echo "Day window (9:30 AM-7:59 PM IST): Pinterest pins"
            python3 scripts/poster.py --platform pinterest
          fi

      - name: Run poster (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          AURELIAN_BRANCH: main
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.platform }}" ]; then ARGS="$ARGS --platform ${{ inputs.platform }}"; fi
          git pull --rebase --autostash origin main || true
          python3 scripts/poster.py $ARGS

      - name: Notify on failure (auto issue, max 3 alerts/day)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%F)
          gh label create automation-failure --color D93F0B --force 2>/dev/null || true
          BODY="Automation run FAILED.

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: ${{ github.event_name }}
          - Time: $(date -u '+%F %T UTC')

          Open the run logs above and check the last lines for the exact API error.
          Missed items auto catch-up on the next successful run (due = date <= today)."
          N=$(gh issue list --search "Poster failed on $TODAY in:title" --json number --jq 'length')
          if [ "$N" -gt 0 ]; then
            NUM=$(gh issue list --search "Poster failed on $TODAY in:title" --json number --jq '.[0].number')
            C=$(gh issue view "$NUM" --json comments --jq '.comments | length')
            if [ "$C" -ge 3 ]; then
              echo "Alert cap reached (3 comments today) - not spamming further."
              exit 0
            fi
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "Poster failed on $TODAY (run ${{ github.run_number }})" --body "$BODY" --label automation-failure
          fi
